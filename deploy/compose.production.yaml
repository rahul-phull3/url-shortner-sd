services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shortlink
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink -d shortlink"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction',
      ]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    build: { context: .. }
    environment:
      DATABASE_URL: postgresql://shortlink:${POSTGRES_PASSWORD}@postgres:5432/shortlink
    command: ["node", "build/scripts/migrate.js"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: { context: .. }
    environment:
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to your HTTPS origin}
      DATABASE_URL: postgresql://shortlink:${POSTGRES_PASSWORD}@postgres:5432/shortlink
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN}
      TRUST_PROXY_HOPS: 1
      LOG_LEVEL: info
    expose: ["3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
  proxy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST without a scheme}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      [
        "./Caddyfile:/etc/caddy/Caddyfile:ro",
        "caddy_data:/data",
        "caddy_config:/config",
      ]
    depends_on: [api]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      [
        "./prometheus.yml:/etc/prometheus/prometheus.yml:ro",
        "./alerts.yml:/etc/prometheus/alerts.yml:ro",
        "prometheus_data:/prometheus",
      ]
    secrets: [metrics_token]
    restart: unless-stopped
secrets:
  metrics_token:
    file: ../secrets/metrics-token
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
