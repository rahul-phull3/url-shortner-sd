name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shortlink_test
          POSTGRES_USER: shortlink
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U shortlink -d shortlink_test" --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://shortlink:test_password@localhost:5432/shortlink_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:integration
      - run: npm run test:edge
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: docker build -t shortlink:ci .
